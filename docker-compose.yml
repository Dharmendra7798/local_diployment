version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: demo_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Application-Code/backend
    container_name: demo_backend
    restart: unless-stopped
    environment:
      - PORT=3500
      - MONGO_CONN_STR=mongodb://mongo:27017/mydb
    ports:
      - "3500:3500"
    depends_on:
      - mongo

  frontend:
    build: ./Application-Code/frontend
    container_name: demo_frontend
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_URL=http://backend:3500/api/tasks
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
